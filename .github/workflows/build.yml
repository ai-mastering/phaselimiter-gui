name: build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      BUILD_JOBS: '2'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      PYTHONUTF8: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build orchestration tools
        run: python -m pip install cmake==3.27.9 ninja==1.13.0 -r script/requirements-icons.txt
      - name: Linux build and windowing tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev nasm pkg-config patchelf ffmpeg optipng libasound2 libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev xvfb xauth
          python -m pip install python-xlib==0.33
      - name: macOS build tools (runner's official Xcode SDK)
        if: runner.os == 'macOS'
        run: |
          brew install nasm pkgconf ffmpeg optipng
          xcrun --sdk macosx --show-sdk-path
      - name: Windows FFmpeg and icon optimizer
        if: runner.os == 'Windows'
        run: choco install ffmpeg optipng -y --no-progress
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          path-type: inherit
          install: make nasm diffutils mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Verify native MSVC linker
        if: runner.os == 'Windows'
        run: |
          $linker = (Get-Command link.exe -CommandType Application).Source
          if (-not $env:VCToolsInstallDir -or -not $linker.StartsWith($env:VCToolsInstallDir, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Expected the Visual Studio linker, found: $linker"
          }
          Write-Host "MSVC linker: $linker"
      - name: Generate and optimize application icons
        run: python script/build-icons.py
      - name: Verify generated icon formats
        run: python script/test-icons.py
      - name: Read pinned backend revision
        id: backend
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          backend = json.load(open('packaging/audio-sources.json'))['backend']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('repository=' + backend['repository'], file=output)
              print('revision=' + backend['revision'], file=output)
          PY
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.backend.outputs.repository }}
          ref: ${{ steps.backend.outputs.revision }}
          path: build/audio/backend
          submodules: recursive
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Fingerprint native libraries and Rust caches
        id: native-keys
        run: python script/audio-cache.py dependencies --target ${{ matrix.target }}
      - name: Restore source downloads
        uses: actions/cache@v4
        with:
          path: build/audio/downloads
          key: ${{ steps.native-keys.outputs.sources-key }}
      - name: Restore Rust dependencies and build outputs
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.native-keys.outputs.cargo-home }}/registry/cache
            ${{ steps.native-keys.outputs.cargo-home }}/registry/index
            ${{ steps.native-keys.outputs.cargo-home }}/git
            target
          key: ${{ steps.native-keys.outputs.rust-key }}
      - name: Discard restored GUI artifacts (host)
        if: steps.rust-cache.outputs.cache-hit == 'true'
        run: cargo clean --workspace
      - name: Discard restored GUI artifacts (distribution target)
        if: steps.rust-cache.outputs.cache-hit == 'true'
        run: cargo clean --workspace --target ${{ matrix.target }}
      - name: Packaging contracts
        run: python script/test-packaging.py -v
      - name: Cache key contracts
        run: python script/test-audio-cache.py -v
      - name: GUI format
        run: cargo fmt --check
      - name: GUI tests
        run: cargo test --locked
      - name: GUI visual previews and save profiling
        shell: bash
        env:
          CHART_REVIEW_DIR: ${{ github.workspace }}/build/test-artifacts/charts
          THEME_REVIEW_DIR: ${{ github.workspace }}/build/test-artifacts/themes
        run: |
          mkdir -p build/test-artifacts
          cargo test --locked visual_review -- --ignored --nocapture
          cargo test --locked profile_selection_save_cost -- --ignored --nocapture 2>&1 | tee build/test-artifacts/save-profile.txt
      - name: Linux playback with ALSA null device
        if: runner.os == 'Linux'
        env:
          ALSA_CONFIG_PATH: ${{ github.workspace }}/script/alsa-null.conf
        run: |
          cargo test --locked device_callback_keeps_running_while_sources_switch -- --ignored --nocapture
          cargo test --locked ab_buttons_play_pause_and_switch_with_a_prepared_device -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-test-artifacts-${{ matrix.target }}
          path: build/test-artifacts
          if-no-files-found: error
      - name: GUI release build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Save Rust cache before audio builds and integration tests
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.native-keys.outputs.cargo-home }}/registry/cache
            ${{ steps.native-keys.outputs.cargo-home }}/registry/index
            ${{ steps.native-keys.outputs.cargo-home }}/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Real X11 file drop
        if: runner.os == 'Linux'
        run: xvfb-run -a python script/test-x11-drop.py target/${{ matrix.target }}/release/phaselimiter-gui
      - name: Fingerprint Unix FFmpeg cache
        if: runner.os != 'Windows'
        id: ffmpeg-key-unix
        run: python script/audio-cache.py ffmpeg --target ${{ matrix.target }}
      - name: Fingerprint MinGW FFmpeg cache
        if: runner.os == 'Windows'
        id: ffmpeg-key-windows
        shell: msys2 {0}
        run: python script/audio-cache.py ffmpeg --target ${{ matrix.target }}
      - name: Restore built FFmpeg tools
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: build/audio/ffmpeg-prefix/bin
          key: ${{ steps.ffmpeg-key-unix.outputs.key || steps.ffmpeg-key-windows.outputs.key }}
      - name: Build LGPL FFmpeg, LAME and zlib (Unix)
        if: runner.os != 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash script/build-ffmpeg.sh
      - name: Build LGPL FFmpeg, LAME and zlib (MinGW)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        env:
          PYTHON: python
        run: bash script/build-ffmpeg.sh
      - name: Save FFmpeg cache before backend builds and tests
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/audio/ffmpeg-prefix/bin
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}
      - name: Restore built backend libraries
        id: library-cache
        uses: actions/cache/restore@v4
        with:
          path: build/audio/prefix
          key: ${{ steps.native-keys.outputs.key }}
      - name: Build backend libraries
        if: steps.library-cache.outputs.cache-hit != 'true'
        run: python script/build-audio.py dependencies
      - name: Save libraries before backend installation modifies the prefix
        if: steps.library-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/audio/prefix
          key: ${{ steps.library-cache.outputs.cache-primary-key }}
      - name: Build phaselimiter
        run: python script/build-audio.py backend
      - name: Backend CLI and component tests
        timeout-minutes: 25
        run: python script/test-audio.py --phase cli
      - name: Backend DSP unit tests
        timeout-minutes: 20
        run: python script/test-audio.py --phase unit
      - name: Native sound-quality cache
        timeout-minutes: 20
        run: python script/test-audio.py --phase cache
      - name: Package complete portable distribution
        run: python script/package-distribution.py --target ${{ matrix.target }}
      - name: Test extracted distribution without development runtime paths
        run: |
          python script/test-distribution.py --archive dist/${{ matrix.target }}/Phaselimiter-${{ matrix.target }}.${{ runner.os == 'Linux' && 'tar.gz' || 'zip' }}
      - name: Packaged GUI real X11 file drop
        if: runner.os == 'Linux'
        run: xvfb-run -a python script/test-x11-drop.py dist/${{ matrix.target }}/Phaselimiter/phaselimiter-gui
      - name: Inspect Windows GUI imports
        if: runner.os == 'Windows'
        run: python script/analyze-windows.py dist/${{ matrix.target }}/Phaselimiter/phaselimiter-gui.exe --check-no-vc-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: phaselimiter-${{ matrix.target }}
          path: dist/${{ matrix.target }}/Phaselimiter-${{ matrix.target }}.*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results-${{ matrix.target }}
          path: |
            build/audio/build/backend/Testing/
            build/audio/stage/BUILD-INFO.json
            build/audio/stage/runtime-dependencies.json
            build/audio/stage/runtime-versions.txt
          if-no-files-found: ignore
